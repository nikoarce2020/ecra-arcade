<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ECRA WATER BLAST V5.5</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#07101d;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#arcade{
    width:min(1100px,98vw);
    height:min(760px,98vh);
    background:linear-gradient(#172338,#0b1424);
    border:8px solid #17283e;
    border-radius:25px;
    box-shadow:
        0 0 0 3px #334b69,
        0 0 35px rgba(0,220,255,.25),
        inset 0 0 30px rgba(0,0,0,.8);
    display:flex;
    flex-direction:column;
    padding:14px;
}

#marquee{
    height:105px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(180deg,#18263b,#101b2d);
    border:3px solid #223954;
    border-radius:18px;
    box-shadow:
        inset 0 0 20px #000,
        0 0 12px rgba(0,220,255,.15);
    flex-shrink:0;
}

.logo{
    color:#35eaff;
    font-size:clamp(35px,6vw,64px);
    font-weight:900;
    letter-spacing:6px;
    line-height:.8;
    text-shadow:
        0 0 5px #00dfff,
        0 0 15px #00dfff,
        0 0 30px #008cff;
}

.subtitle{
    margin-top:12px;
    color:white;
    font-size:clamp(10px,1.6vw,15px);
    font-weight:bold;
    letter-spacing:5px;
    text-shadow:0 0 8px #00eaff;
}

#screenFrame{
    flex:1;
    min-height:0;
    margin-top:12px;
    padding:8px;
    background:#08111e;
    border:4px solid #273e5c;
    border-radius:15px;
    box-shadow:
        inset 0 0 25px #000,
        0 0 12px rgba(0,220,255,.15);
    position:relative;
}

#game{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    border-radius:7px;
    background:
        linear-gradient(#38c9ed,#d8f8ff 55%,#58d9dd 56%,#087fa0 100%);
}

#game::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 2px,
            rgba(0,0,0,.035) 3px,
            rgba(0,0,0,.035) 5px
        );
    z-index:100;
}

#fallbackSky{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 80% 20%,rgba(255,255,220,.9) 0 5%,transparent 6%),
        linear-gradient(
            to bottom,
            #18bce8 0%,
            #76e4ef 55%,
            #a7ecdc 56%,
            #20a9b7 75%,
            #077891 100%
        );
    z-index:-1;
}

#background{
    position:absolute;
    inset:0;
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
    z-index:0;
}

#hud{
    position:absolute;
    left:12px;
    right:12px;
    top:10px;
    display:flex;
    justify-content:space-between;
    z-index:90;
    pointer-events:none;
}

.hudBox{
    background:rgba(5,16,29,.82);
    color:white;
    padding:7px 11px;
    border-radius:7px;
    border:2px solid rgba(255,255,255,.18);
    font-size:13px;
    font-weight:900;
    text-shadow:0 2px 2px #000;
}

#stageBox{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(140,45,45,.85);
    color:white;
    padding:7px 15px;
    border-radius:7px;
    font-weight:900;
    z-index:90;
    pointer-events:none;
}

#difficulty{
    position:absolute;
    top:45px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    background:rgba(0,0,0,.55);
    padding:3px 9px;
    border-radius:10px;
    font-size:9px;
    font-weight:bold;
    letter-spacing:2px;
    z-index:90;
}

.platform{
    position:absolute;
    height:16px;
    border-radius:10px;
    background:
        linear-gradient(
            to bottom,
            #efffff 0%,
            #4deaff 30%,
            #16b6d1 65%,
            #087a9c 100%
        );
    border:3px solid #d7ffff;
    box-shadow:
        0 0 6px rgba(0,240,255,.9),
        inset 0 -4px 6px rgba(0,0,0,.25);
    z-index:20;
}

#player{
    position:absolute;
    width:48px;
    height:58px;
    z-index:50;
    pointer-events:none;
    transform-origin:center bottom;
    will-change:transform,left,top;
    backface-visibility:hidden;
}

#player img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    image-rendering:auto;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.45));
    will-change:transform;
}

.enemy{
    position:absolute;
    width:48px;
    height:48px;
    z-index:45;
    pointer-events:none;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.4));
    will-change:transform,left,top;
    backface-visibility:hidden;
}

.enemyBody{
    width:100%;
    height:100%;
    position:relative;
}

.octopusBody{
    position:absolute;
    width:32px;
    height:32px;
    left:8px;
    top:3px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#ffffff 0 7%,transparent 8%),
        radial-gradient(circle at 65% 30%,#ffffff 0 7%,transparent 8%),
        linear-gradient(#b78cff,#6741d8);
    border:3px solid #5234aa;
}

.octopusEye{
    position:absolute;
    width:6px;
    height:6px;
    background:#182040;
    border-radius:50%;
    top:14px;
    z-index:3;
}

.octopusEye.left{left:17px;}
.octopusEye.right{left:28px;}

.tentacle{
    position:absolute;
    bottom:1px;
    width:9px;
    height:23px;
    border-radius:8px;
    background:#7148db;
    transform-origin:top center;
}

.t1{left:7px;transform:rotate(16deg);}
.t2{left:15px;transform:rotate(5deg);}
.t3{left:23px;transform:rotate(-5deg);}
.t4{left:31px;transform:rotate(-16deg);}

.crabBody{
    position:absolute;
    width:35px;
    height:30px;
    left:7px;
    top:7px;
    border-radius:50% 50% 42% 42%;
    background:
        radial-gradient(circle at 32% 25%,#fff 0 7%,transparent 8%),
        radial-gradient(circle at 68% 25%,#fff 0 7%,transparent 8%),
        linear-gradient(#ffb247,#df6323);
    border:3px solid #bd4c1b;
}

.crabEye{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#222;
    top:14px;
    z-index:4;
}

.crabEye.left{left:16px;}
.crabEye.right{left:27px;}

.claw{
    position:absolute;
    width:12px;
    height:15px;
    border:4px solid #df6323;
    border-radius:50%;
    top:8px;
}

.claw.left{left:-2px;transform:rotate(25deg);}
.claw.right{right:-2px;transform:rotate(-25deg);}

.leg{
    position:absolute;
    width:13px;
    height:5px;
    background:#df6323;
    border-radius:5px;
    top:35px;
}

.leg.l1{left:4px;transform:rotate(25deg);}
.leg.l2{left:14px;transform:rotate(10deg);}
.leg.l3{right:14px;transform:rotate(-10deg);}
.leg.l4{right:4px;transform:rotate(-25deg);}

.enemy.jumping .tentacle{
    animation:wobble .22s infinite alternate;
}

@keyframes wobble{
    from{transform:rotate(10deg);}
    to{transform:rotate(-10deg);}
}

.waterShot{
    position:absolute;
    width:17px;
    height:9px;
    border-radius:10px;
    background:
        radial-gradient(circle at 35% 35%,#fff 0 15%,transparent 16%),
        linear-gradient(90deg,#ffffff,#30eaff,#00a9ff);
    box-shadow:
        0 0 8px #00eaff,
        0 0 14px #00bfff;
    z-index:48;
    will-change:left;
}

.drop{
    position:absolute;
    width:22px;
    height:28px;
    border-radius:60% 60% 60% 60% / 75% 75% 40% 40%;
    background:
        radial-gradient(circle at 35% 28%,#fff 0 12%,transparent 13%),
        linear-gradient(#a9ffff,#00b9ed);
    transform:rotate(45deg);
    box-shadow:0 0 12px #00eaff;
    z-index:42;
    animation:dropFloat .7s infinite alternate;
}

@keyframes dropFloat{
    from{transform:rotate(45deg) translateY(0);}
    to{transform:rotate(45deg) translateY(-5px);}
}

#jellyfish{
    position:absolute;
    width:40px;
    height:45px;
    z-index:35;
    display:none;
}

.jellyHead{
    width:32px;
    height:26px;
    margin:auto;
    border-radius:50% 50% 35% 35%;
    background:rgba(255,110,230,.9);
    border:3px solid #ff70ea;
    box-shadow:0 0 12px #ff49db;
}

.jellyTentacle{
    position:absolute;
    width:6px;
    height:22px;
    background:#ff74e9;
    border-radius:5px;
    top:23px;
}

.jellyTentacle:nth-child(2){left:4px;}
.jellyTentacle:nth-child(3){left:14px;}
.jellyTentacle:nth-child(4){left:24px;}
.jellyTentacle:nth-child(5){right:2px;}

#message{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:clamp(26px,6vw,58px);
    font-weight:900;
    text-align:center;
    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00aaff;
    z-index:110;
    pointer-events:none;
    opacity:0;
    transition:opacity .15s;
}

#message.show{
    opacity:1;
}

#gameOver{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    z-index:120;
    text-align:center;
}

#gameOver h1{
    margin:0 0 12px;
    font-size:clamp(30px,7vw,65px);
    color:#ff6464;
    text-shadow:0 0 15px #f00;
}

#gameOver p{
    font-size:18px;
}

#restart{
    border:0;
    padding:12px 25px;
    border-radius:12px;
    background:#18d9ef;
    color:#00121c;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

#controls{
    height:78px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 25px;
    flex-shrink:0;
}

.controlGroup{
    display:flex;
    gap:12px;
}

.arcadeBtn{
    width:58px;
    height:50px;
    border:3px solid #244760;
    border-radius:12px;
    background:linear-gradient(#43e7f7,#0798b6);
    color:white;
    font-size:25px;
    font-weight:900;
    box-shadow:
        0 5px 0 #07566a,
        0 0 12px rgba(0,220,255,.25);
    touch-action:none;
    user-select:none;
}

.arcadeBtn:active{
    transform:translateY(4px);
    box-shadow:
        0 1px 0 #07566a,
        0 0 8px rgba(0,220,255,.3);
}

#shootBtn{
    background:linear-gradient(#ffd64d,#f28b00);
    border-color:#6c4c0b;
    box-shadow:
        0 5px 0 #754400,
        0 0 12px rgba(255,180,0,.25);
}

@media(max-width:600px){

    #arcade{
        width:100vw;
        height:100vh;
        border-radius:0;
        border-width:4px;
        padding:6px;
    }

    #marquee{
        height:75px;
    }

    #screenFrame{
        margin-top:7px;
        padding:4px;
    }

    #controls{
        height:75px;
        padding:3px 8px;
    }

    .arcadeBtn{
        width:55px;
        height:48px;
    }

    .controlGroup{
        gap:7px;
    }

    .hudBox{
        font-size:10px;
        padding:5px 7px;
    }
}
</style>
</head>

<body>

<div id="arcade">

    <div id="marquee">
        <div class="logo">ECRA</div>
        <div class="subtitle">WATER BLAST</div>
    </div>

    <div id="screenFrame">

        <div id="game">

            <div id="fallbackSky"></div>
            <div id="background"></div>

            <div id="hud">

                <div class="hudBox">
                    SCORE <span id="score">000000</span>
                </div>

                <div class="hudBox">
                    VIDAS <span id="lives">♥ ♥ ♥</span>
                </div>

            </div>

            <div id="stageBox">
                STAGE <span id="stage">1</span>
            </div>

            <div id="difficulty">
                EXPERT
            </div>

            <div id="message"></div>

            <div id="player">
                <img id="playerImg" src="ecra_walk1.png">
            </div>

            <div id="jellyfish">

                <div class="jellyHead"></div>
                <div class="jellyTentacle"></div>
                <div class="jellyTentacle"></div>
                <div class="jellyTentacle"></div>
                <div class="jellyTentacle"></div>

            </div>

            <div id="gameOver">

                <h1>GAME OVER</h1>

                <p>
                    PUNTAJE:
                    <span id="finalScore">0</span>
                </p>

                <button id="restart">
                    JUGAR DE NUEVO
                </button>

            </div>

        </div>

    </div>

    <div id="controls">

        <div class="controlGroup">

            <button class="arcadeBtn" id="leftBtn">
                ◀
            </button>

            <button class="arcadeBtn" id="rightBtn">
                ▶
            </button>

        </div>

        <div class="controlGroup">

            <button class="arcadeBtn" id="jumpBtn">
                ▲
            </button>

            <button class="arcadeBtn" id="shootBtn">
                ●
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   ECRA WATER BLAST V5.5
   MOVIMIENTO FLUIDO
   ========================================================= */


/* ---------- ELEMENTOS ---------- */

const game=document.getElementById("game");
const background=document.getElementById("background");

const playerEl=document.getElementById("player");
const playerImg=document.getElementById("playerImg");

const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const stageEl=document.getElementById("stage");

const messageEl=document.getElementById("message");
const gameOverEl=document.getElementById("gameOver");
const finalScoreEl=document.getElementById("finalScore");

const jellyfishEl=document.getElementById("jellyfish");


/* =========================================================
   FONDOS
   ========================================================= */

const backgrounds={

    1:"playa.png",
    2:"barco.png",
    3:"isla.png",
    4:"cueva.png",
    5:"monstruo.png"

};

let currentBackgroundLoaded=false;


function setBackground(level){

    background.style.backgroundImage="none";
    background.style.backgroundColor="transparent";

    currentBackgroundLoaded=false;

    const file=backgrounds[level]||"playa.png";

    const img=new Image();

    img.onload=function(){

        background.style.backgroundImage=
            "url('"+file+"')";

        currentBackgroundLoaded=true;

    };

    img.onerror=function(){

        background.style.backgroundImage="none";
        background.style.backgroundColor="transparent";

        currentBackgroundLoaded=false;

    };

    img.src=file;
}


/* =========================================================
   TAMAÑO
   ========================================================= */

let W=800;
let H=450;


function resizeGame(){

    W=game.clientWidth;
    H=game.clientHeight;

    buildPlatforms();

    if(!gameRunning && !transitioning){

        placePlayer();

    }

}


/* =========================================================
   PLATAFORMAS
   ========================================================= */

let platforms=[];


function buildPlatforms(){

    platforms=[

        {
            x:0,
            y:H*.91,
            w:W,
            h:16
        },

        {
            x:W*.06,
            y:H*.76,
            w:W*.30,
            h:16
        },

        {
            x:W*.29,
            y:H*.56,
            w:W*.40,
            h:16
        },

        {
            x:W*.65,
            y:H*.76,
            w:W*.29,
            h:16
        }

    ];


    document
        .querySelectorAll(".platform")
        .forEach(p=>p.remove());


    platforms.forEach((p,index)=>{

        const el=document.createElement("div");

        el.className="platform";

        el.dataset.index=index;

        el.style.left=p.x+"px";
        el.style.top=p.y+"px";
        el.style.width=p.w+"px";
        el.style.height=p.h+"px";

        game.appendChild(el);

    });

}


/* =========================================================
   JUGADOR
   ========================================================= */

const player={

    x:0,
    y:0,

    w:48,
    h:58,

    vx:0,
    vy:0,

    /* MÁS VELOCIDAD */

    speed:6.5,

    jumpPower:13.4,

    gravity:.62,

    grounded:false,

    currentPlatform:0,

    direction:1,

    invulnerable:0,

    animTimer:0,

    animFrame:0

};


/* =========================================================
   SPRITES
   ========================================================= */

const walkSprites=[

    "ecra_walk1.png",
    "ecra_walk2.png",
    "ecra_walk3.png",
    "ecra_walk4.png"

];


const idleCandidates=[

    "ecra_idle.png",
    "ecra_indle.png",
    "ecra_walk1.png"

];


let idleSprite="ecra_walk1.png";


function findIdleSprite(){

    let index=0;


    function test(){

        if(index>=idleCandidates.length){

            idleSprite="ecra_walk1.png";

            return;
        }


        const img=new Image();


        img.onload=function(){

            idleSprite=idleCandidates[index];

        };


        img.onerror=function(){

            index++;

            test();

        };


        img.src=idleCandidates[index];

    }


    test();

}


/* =========================================================
   CONTROLES
   ========================================================= */

const keys={

    left:false,
    right:false,
    jump:false,
    shoot:false

};


let jumpPressed=false;
let shootPressed=false;


function bindButton(id,key){

    const btn=document.getElementById(id);


    const down=function(e){

        e.preventDefault();

        keys[key]=true;


        if(key==="jump"){

            jumpPressed=true;

        }


        if(key==="shoot"){

            shootPressed=true;

        }

    };


    const up=function(e){

        e.preventDefault();

        keys[key]=false;

    };


    btn.addEventListener(
        "touchstart",
        down,
        {passive:false}
    );

    btn.addEventListener(
        "touchend",
        up,
        {passive:false}
    );

    btn.addEventListener(
        "touchcancel",
        up,
        {passive:false}
    );

    btn.addEventListener(
        "mousedown",
        down
    );

    btn.addEventListener(
        "mouseup",
        up
    );

    btn.addEventListener(
        "mouseleave",
        up
    );

}


bindButton("leftBtn","left");
bindButton("rightBtn","right");
bindButton("jumpBtn","jump");
bindButton("shootBtn","shoot");


document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key==="ArrowLeft" ||
            e.key==="a" ||
            e.key==="A"
        ){

            keys.left=true;

        }


        if(
            e.key==="ArrowRight" ||
            e.key==="d" ||
            e.key==="D"
        ){

            keys.right=true;

        }


        if(
            e.key==="ArrowUp" ||
            e.key==="w" ||
            e.key==="W" ||
            e.key===" "
        ){

            if(!keys.jump){

                jumpPressed=true;

            }

            keys.jump=true;

            e.preventDefault();

        }


        if(
            e.key==="z" ||
            e.key==="Z" ||
            e.key==="x" ||
            e.key==="X"
        ){

            keys.shoot=true;

            shootPressed=true;

        }

    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(
            e.key==="ArrowLeft" ||
            e.key==="a" ||
            e.key==="A"
        ){

            keys.left=false;

        }


        if(
            e.key==="ArrowRight" ||
            e.key==="d" ||
            e.key==="D"
        ){

            keys.right=false;

        }


        if(
            e.key==="ArrowUp" ||
            e.key==="w" ||
            e.key==="W" ||
            e.key===" "
        ){

            keys.jump=false;

        }


        if(
            e.key==="z" ||
            e.key==="Z" ||
            e.key==="x" ||
            e.key==="X"
        ){

            keys.shoot=false;

        }

    }
);


/* =========================================================
   COLOCAR JUGADOR
   ========================================================= */

function placePlayer(){

    if(!platforms.length)return;

    const p=platforms[0];

    player.x=
        W*.50-player.w/2;

    player.y=
        p.y-player.h;

    player.vx=0;
    player.vy=0;

    player.grounded=true;

    player.currentPlatform=0;

    updatePlayerElement();

}


function updatePlayerElement(){

    playerEl.style.left=
        player.x+"px";

    playerEl.style.top=
        player.y+"px";


    playerEl.style.transform=
        "scaleX("+
        (player.direction===1?-1:1)+
        ")";

}


/* =========================================================
   ANIMACIÓN
   ========================================================= */

let lastMoving=false;


function updatePlayerSprite(dt=1){

    const moving=
        Math.abs(player.vx)>.3 &&
        player.grounded;


    if(moving){

        /* ANIMACIÓN MÁS RÁPIDA */

        player.animTimer+=dt;


        if(player.animTimer>4){

            player.animTimer=0;

            player.animFrame++;


            if(
                player.animFrame>=
                walkSprites.length
            ){

                player.animFrame=0;

            }

        }


        const newSprite=
            walkSprites[player.animFrame];


        if(
            !playerImg.src.endsWith(newSprite)
        ){

            playerImg.src=newSprite;

        }


        lastMoving=true;

    }else{

        if(lastMoving){

            playerImg.src=idleSprite;

            player.animFrame=0;

            player.animTimer=0;

        }

        lastMoving=false;

    }

}

   ========================================================= */

let lastFrameTime=performance.now();


function getFrameScale(){

    const now=performance.now();

    let delta=
        now-lastFrameTime;

    lastFrameTime=now;


    if(delta>50){

        delta=50;

    }


    return delta/16.6667;

}


/* =========================================================
   FÍSICA DEL JUGADOR
   ========================================================= */

function updatePlayer(dt=1){

    if(player.invulnerable>0){

        player.invulnerable-=dt;

        if(player.invulnerable<0){

            player.invulnerable=0;

        }

    }


    if(keys.left && !keys.right){

        player.vx=-player.speed;

        player.direction=-1;

    }

    else if(keys.right && !keys.left){

        player.vx=player.speed;

        player.direction=1;

    }

    else{

        player.vx*=Math.pow(.75,dt);

        if(Math.abs(player.vx)<.05){

            player.vx=0;

        }

    }


    if(jumpPressed){

        jumpPlayer();

        jumpPressed=false;

    }


    player.x+=player.vx*dt;


    if(player.x<0){

        player.x=0;

    }


    if(player.x>W-player.w){

        player.x=W-player.w;

    }


    const oldBottom=
        player.y+player.h;


    player.vy+=
        player.gravity*dt;


    if(player.vy>16){

        player.vy=16;

    }


    player.y+=
        player.vy*dt;


    player.grounded=false;

    player.currentPlatform=-1;


    for(
        let i=0;
        i<platforms.length;
        i++
    ){

        const p=platforms[i];


        const horizontal=

            player.x+
            player.w-
            7>p.x &&

            player.x+
            7<
            p.x+p.w;


        const crossing=

            oldBottom<=p.y+5 &&

            player.y+
            player.h>=p.y &&

            player.vy>=0;


        if(horizontal && crossing){

            player.y=
                p.y-player.h;

            player.vy=0;

            player.grounded=true;

            player.currentPlatform=i;

            break;

        }

    }


    updatePlayerElement();

    updatePlayerSprite(dt);

}

        }

    }

        }

        }

        }

    }

/* =========================================================
   SIGUIENTE PLATAFORMA
   ========================================================= */

function chooseNextPlatform(e){

    const current=
        e.platformIndex;

    let candidates=[];


    for(
        let i=0;
        i<e.route.length;
        i++
    ){

        const candidate=e.route[i];

        if(candidate===current)continue;


        const diff=
            platforms[candidate].y-
            platforms[current].y;


        if(Math.abs(diff)<H*.42){

            candidates.push(candidate);

        }

    }


    if(!candidates.length){

        candidates=
            [0,1,2,3]
            .filter(x=>x!==current);

    }


    const used=
        enemies
        .filter(
            other=>
                other.alive &&
                other!==e
        )
        .map(
            other=>
                other.targetPlatform
        );


    let free=
        candidates.filter(
            c=>!used.includes(c)
        );


    if(free.length){

        candidates=free;

    }


    const target=
        candidates[
            Math.floor(
                Math.random()*
                candidates.length
            )
        ];


    e.targetPlatform=target;

}


/* =========================================================
   SALTO ENEMIGO
   ========================================================= */

function enemyJump(e){

    if(!e.grounded)return;

    if(e.jumpCooldown>0)return;

    if(e.waitTimer>0)return;


    chooseNextPlatform(e);


    const target=
        platforms[e.targetPlatform];

    const current=
        platforms[e.platformIndex];


    const targetCenter=
        target.x+
        target.w/2;


    const currentCenter=
        current.x+
        current.w/2;


    const horizontalDistance=
        Math.abs(
            targetCenter-currentCenter
        );


    if(horizontalDistance>W*.65){

        e.targetPlatform=0;

    }


    e.vy=
        -e.jumpPower;

    e.grounded=false;

    e.platformIndex=-1;

    e.jumpCooldown=90;


    if(e.element){

        e.element.classList.add(
            "jumping"
        );

    }

}


/* =========================================================
   FÍSICA ENEMIGO
   ========================================================= */

function updateEnemy(e,dt=1){

    if(!e.alive)return;


    if(e.jumpCooldown>0){

        e.jumpCooldown-=dt;

        if(e.jumpCooldown<0){

            e.jumpCooldown=0;

        }

    }


    if(e.waitTimer>0){

        e.waitTimer-=dt;

        if(e.waitTimer<0){

            e.waitTimer=0;

        }

    }


    /* ==========================================
       ENEMIGO EN EL AIRE
       ========================================== */

    if(!e.grounded){

        const target=
            platforms[e.targetPlatform];


        if(target){

            const targetCenter=
                target.x+
                target.w/2;

            const enemyCenter=
                e.x+
                e.w/2;


            if(
                enemyCenter<
                targetCenter-12
            ){

                e.vx=e.speed;

                e.direction=1;

            }

            else if(
                enemyCenter>
                targetCenter+12
            ){

                e.vx=-e.speed;

                e.direction=-1;

            }

            else{

                e.vx*=
                    Math.pow(.85,dt);

            }

        }


        e.vy+=
            e.gravity*dt;


        if(e.vy>15){

            e.vy=15;

        }


        e.x+=e.vx*dt;

        e.y+=e.vy*dt;


        /* ==================================
           COLISIÓN CON PLATAFORMAS
           ================================== */

        for(
            let i=0;
            i<platforms.length;
            i++
        ){

            const p=
                platforms[i];


            const horizontal=

                e.x+
                e.w-
                7>p.x &&

                e.x+
                7<
                p.x+p.w;


            const landing=

                e.y+
                e.h>=p.y &&

                e.y+
                e.h<=p.y+24 &&

                e.vy>=0;


            if(horizontal && landing){

                e.y=
                    p.y-e.h;

                e.vy=0;

                e.grounded=true;

                e.platformIndex=i;


                if(i===1){

                    e.waitTimer=170;

                }

                else if(i===2){

                    e.waitTimer=210;

                }

                else if(i===3){

                    e.waitTimer=140;

                }

                else{

                    e.waitTimer=70;

                }


                if(e.element){

                    e.element.classList.remove(
                        "jumping"
                    );

                }

                break;

            }

        }


        /* ==================================
           RECUPERACIÓN
           ================================== */

        if(e.y>H+100){

            e.platformIndex=0;

            e.y=
                platforms[0].y-
                e.h;

            e.x=
                Math.random()*
                Math.max(
                    1,
                    W-e.w
                );

            e.vy=0;

            e.grounded=true;

            e.waitTimer=70;

        }

    }

    else{

        /* ==================================
           ENEMIGO SOBRE BASE
           ================================== */

        const p=
            platforms[e.platformIndex];


        if(!p){

            e.grounded=false;

            return;

        }


        e.vx=
            e.direction*
            e.speed;


        e.x+=
            e.vx*dt;


        const leftEdge=
            e.x<=p.x;

        const rightEdge=
            e.x+e.w>=p.x+p.w;


        if(
            (leftEdge || rightEdge) &&
            e.waitTimer<=0
        ){

            const chance=
                Math.random();


            if(chance<.78){

                enemyJump(e);

            }

            else{

                e.grounded=false;

                e.platformIndex=-1;

                e.vy=1;

            }

        }


        if(e.grounded){

            if(e.x<p.x){

                e.x=p.x;

            }


            if(e.x+e.w>p.x+p.w){

                e.x=
                    p.x+
                    p.w-
                    e.w;

            }

        }


        /* Movimiento pequeño durante espera */

        if(e.waitTimer>0){

            e.vx*=.35;

            e.x+=
                Math.sin(
                    (Date.now()+
                    e.separationSeed*100)/
                    500
                )*.25;

        }


        /* Salto ocasional */

        if(
            e.waitTimer<=0 &&
            Math.random()<.009*dt
        ){

            enemyJump(e);

        }

    }


    updateEnemyElement(e);

}

    shots.push({

        x:sx,

        /* DISPARO MÁS RÁPIDO */

    });

/* =========================================================
   ACTUALIZAR DISPAROS
   ========================================================= */

function updateShots(dt=1){

    for(
        let i=shots.length-1;
        i>=0;
        i--
    ){

        const s=shots[i];


        s.x+=
            s.vx*dt;


        s.element.style.left=
            s.x+"px";


        s.element.style.top=
            s.y+"px";


        let hit=false;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const e=
                enemies[j];


            if(!e.alive)continue;


            if(
                rectOverlap(
                    s.x,
                    s.y,
                    s.w,
                    s.h,
                    e.x+8,
                    e.y+7,
                    e.w-16,
                    e.h-10
                )
            ){

                hit=true;

                e.hp--;


                createWaterHit(
                    s.x,
                    s.y
                );


                if(e.hp<=0){

                    defeatEnemy(e);

                }


                break;

            }

        }


        if(
            hit ||
            s.x<-50 ||
            s.x>W+50
        ){

            s.element.remove();

            shots.splice(i,1);

        }

    }

}

   ========================================================= */

function updateDrops(){

    enemies.forEach(e=>{

        if(
            !e.drop ||
            e.dropCollected
        ){

            return;

        }


        const dx=
            e.x+
            e.w/2;

        const dy=
            e.y+
            e.h/2;


        const dropX=
            parseFloat(
                e.drop.style.left
            )+11;


        const dropY=
            parseFloat(
                e.drop.style.top
            )+14;


        const distance=
            Math.hypot(
                player.x+
                player.w/2-dx,

                player.y+
                player.h/2-dy
            );


        const playerDistance=
            Math.hypot(

                player.x+
                player.w/2-
                dropX,

                player.y+
                player.h/2-
                dropY

            );


        if(playerDistance<45){

            e.dropCollected=true;

            e.drop.remove();

            e.drop=null;

            score+=250;

            updateScore();

        }

    });

}


/* =========================================================
   COLISIONES
   ========================================================= */

function rectOverlap(
    ax,ay,aw,ah,
    bx,by,bw,bh
){

    return(

        ax<bx+bw &&

        ax+aw>bx &&

        ay<by+bh &&

        ay+ah>by

    );

}


/* =========================================================
   HITBOX JUGADOR
   ========================================================= */

function playerHitBox(){

    return{

        left:
            player.x+12,

        right:
            player.x+
            player.w-
            12,

        top:
            player.y+16,

        bottom:
            player.y+
            player.h-
            5

    };

}


/* =========================================================
   HITBOX ENEMIGO
   ========================================================= */

function enemyHitBox(e){

    return{

        left:
            e.x+10,

        right:
            e.x+
            e.w-
            10,

        top:
            e.y+8,

        bottom:
            e.y+
            e.h-
            6

    };

}


/* =========================================================
   COLISIÓN ENEMIGO
   ========================================================= */

function checkEnemyCollisions(){

    const p=
        playerHitBox();


    for(const e of enemies){

        if(!e.alive)continue;


        const h=
            enemyHitBox(e);


        if(
            player.grounded &&
            e.grounded &&
            player.currentPlatform!==e.platformIndex
        ){

            continue;

        }


        if(

            p.left<h.right &&

            p.right>h.left &&

            p.top<h.bottom &&

            p.bottom>h.top

        ){

            loseLife();

            break;

        }

    }

}

        stage;


    setBackground(stage);

    buildPlatforms();

    createStageEnemies();


    player.x=
        W*.5-
        player.w/2;


    player.y=
        -player.h-
        20;


    player.vx=0;

    player.vy=3;

    player.grounded=false;

    player.currentPlatform=-1;


    showMessage(
        "STAGE "+stage,
        1000
    );


    transitioning=false;

    gameRunning=true;

}


/* =========================================================
   GAME OVER
   ========================================================= */

function endGame(){

    gameRunning=false;

    finalScoreEl.textContent=
        score;

    gameOverEl.style.display=
        "flex";

}


/* =========================================================
   REINICIAR
   ========================================================= */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        function(){

            lives=3;

            score=0;

            stage=1;


            updateLives();

            updateScore();


            gameOverEl.style.display=
                "none";


            victory=false;

            transitioning=false;


            setBackground(stage);

            buildPlatforms();

            createStageEnemies();

            placePlayer();


            gameRunning=true;

            lastFrameTime=
                performance.now();

        }
    );


/* =========================================================
   LOOP PRINCIPAL
   ========================================================= */

function gameLoop(){

    requestAnimationFrame(
        gameLoop
    );


    const dt=
        getFrameScale();


    if(!gameRunning)return;


    if(
        shootPressed ||
        keys.shoot
    ){

        shoot();

        shootPressed=false;

    }


    updatePlayer(dt);

    updateShots(dt);


    enemies.forEach(
        e=>
            updateEnemy(e,dt)
    );


    updateDrops();

    checkEnemyCollisions();

    updateJellyfish();

    checkStageComplete();

}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function(){

        resizeGame();

    }
);


/* =========================================================
   RESPALDO SPRITE
   ========================================================= */

playerImg.onerror=function(){

    if(
        playerImg.src.indexOf(
            "ecra_walk1.png"
        )===-1
    ){

        playerImg.src=
            "ecra_walk1.png";

    }

};


/* =========================================================
   INICIO
   ========================================================= */

setBackground(1);

findIdleSprite();


setTimeout(()=>{

    resizeGame();

    buildPlatforms();

    createStageEnemies();

    placePlayer();

    updateLives();

    updateScore();

    lastFrameTime=
        performance.now();

    gameLoop();

},100);


/* =========================================================
   FIN ECRA V5.5
   ========================================================= */

</script>

</body>
</html>
