<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>ECRA - Water Quest</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#06152b;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
}

#hud{
    position:fixed;
    top:8px;
    left:8px;
    right:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
    pointer-events:none;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px 3px #000;
    font-size:16px;
}

#levelText{
    text-align:center;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:10px;
    height:125px;
    z-index:20;
    pointer-events:none;
}

.btn{
    pointer-events:auto;
    position:absolute;
    width:70px;
    height:70px;
    border-radius:22px;
    border:3px solid rgba(255,255,255,.75);
    background:rgba(0,35,70,.72);
    color:white;
    font-size:31px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
    -webkit-tap-highlight-color:transparent;
}

.btn:active{
    transform:scale(.90);
    background:rgba(0,170,220,.9);
}

#left{
    left:12px;
    bottom:8px;
}

#right{
    left:92px;
    bottom:8px;
}

#jump{
    right:92px;
    bottom:8px;
}

#water{
    right:12px;
    bottom:8px;
    font-size:25px;
}

#message{
    position:fixed;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,8,25,.72);
    color:white;
    text-align:center;
    padding:25px;
}

#message h1{
    font-size:clamp(35px,9vw,75px);
    margin-bottom:15px;
    text-shadow:0 0 20px #00eaff;
}

#message p{
    font-size:18px;
    margin-bottom:25px;
}

#start{
    border:0;
    padding:16px 35px;
    border-radius:18px;
    font-size:21px;
    font-weight:bold;
    background:#00d9ff;
    color:#00243b;
    box-shadow:0 0 25px #00d9ff;
}

.hidden{
    display:none!important;
}

@media(max-height:500px){
    #controls{
        height:90px;
        bottom:5px;
    }

    .btn{
        width:56px;
        height:56px;
        border-radius:17px;
        font-size:25px;
    }

    #left{left:8px;bottom:3px}
    #right{left:70px;bottom:3px}
    #jump{right:70px;bottom:3px}
    #water{right:8px;bottom:3px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="lives">❤️❤️❤️❤️❤️❤️❤️</div>
    <div id="levelText">COSTA TURQUESA</div>
    <div id="score">000000</div>
</div>

<div id="controls">
    <div class="btn" id="left">←</div>
    <div class="btn" id="right">→</div>
    <div class="btn" id="jump">↑</div>
    <div class="btn" id="water">💧</div>
</div>

<div id="message">
    <h1>ECRA</h1>
    <p>WATER QUEST</p>
    <p>Una aventura bajo el océano</p>
    <button id="start">JUGAR 🎮</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=1280;
let H=720;

function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

/* =========================
   DATOS DEL JUEGO
========================= */

const levels=[
    "COSTA TURQUESA",
    "ARRECIFE DE CORAL",
    "CUEVAS PROFUNDAS",
    "TEMPLO SUMERGIDO",
    "VOLCÁN DEL OCÉANO"
];

let level=0;
let score=0;
let lives=7;
let gameStarted=false;
let gameOver=false;
let levelComplete=false;
let bossActive=false;

let cameraX=0;

const keys={
    left:false,
    right:false,
    jump:false,
    water:false
};

let platforms=[];
let enemies=[];
let shots=[];
let bubbles=[];
let particles=[];

let portal=null;
let boss=null;

const player={
    x:120,
    y:400,
    w:45,
    h:65,
    vx:0,
    vy:0,
    speed:4.5,
    jump:-12,
    grounded:false,
    direction:1,
    invincible:0,
    shootCooldown:0,
    anim:0
};

/* =========================
   CONTROLES
========================= */

function bindButton(id,key){
    const b=document.getElementById(id);

    const down=e=>{
        e.preventDefault();
        keys[key]=true;
    };

    const up=e=>{
        e.preventDefault();
        keys[key]=false;
    };

    b.addEventListener("touchstart",down,{passive:false});
    b.addEventListener("touchend",up,{passive:false});
    b.addEventListener("touchcancel",up,{passive:false});

    b.addEventListener("mousedown",down);
    b.addEventListener("mouseup",up);
    b.addEventListener("mouseleave",up);
}

bindButton("left","left");
bindButton("right","right");
bindButton("jump","jump");
bindButton("water","water");

window.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"||e.key==="a")
        keys.left=true;

    if(e.key==="ArrowRight"||e.key==="d")
        keys.right=true;

    if(e.key==="ArrowUp"||e.key==="w"||e.key==="z")
        keys.jump=true;

    if(e.key===" "||e.key==="x")
        keys.water=true;
});

window.addEventListener("keyup",e=>{
    if(e.key==="ArrowLeft"||e.key==="a")
        keys.left=false;

    if(e.key==="ArrowRight"||e.key==="d")
        keys.right=false;

    if(e.key==="ArrowUp"||e.key==="w"||e.key==="z")
        keys.jump=false;

    if(e.key===" "||e.key==="x")
        keys.water=false;
});

/* =========================
   UTILIDADES
========================= */

function rand(a,b){
    return Math.random()*(b-a)+a;
}

function hit(a,b){
    return a.x<a.x+a.w &&
           a.x+a.w>b.x &&
           a.y<b.y+b.h &&
           a.y+a.h>b.y;
}

function rectHit(a,b){
    return a.x < b.x+b.w &&
           a.x+a.w > b.x &&
           a.y < b.y+b.h &&
           a.y+a.h > b.y;
}

function addParticle(x,y,type="water"){
    particles.push({
        x:x,
        y:y,
        vx:rand(-2,2),
        vy:rand(-3,1),
        life:1,
        type:type
    });
}

/* =========================
   ESCENARIOS
========================= */

function createLevel(){

    platforms=[];
    enemies=[];
    shots=[];
    bubbles=[];
    particles=[];
    portal=null;
    boss=null;
    bossActive=false;

    player.x=100;
    player.y=300;
    player.vx=0;
    player.vy=0;
    player.invincible=2;

    const groundY=H-145;

    platforms.push({
        x:-200,
        y:groundY,
        w:1700,
        h:35
    });

    if(level===0){

        platforms.push({x:180,y:groundY-125,w:210,h:22});
        platforms.push({x:500,y:groundY-230,w:220,h:22});
        platforms.push({x:850,y:groundY-130,w:230,h:22});
        platforms.push({x:1160,y:groundY-260,w:220,h:22});

    }else if(level===1){

        platforms.push({x:120,y:groundY-180,w:190,h:22});
        platforms.push({x:390,y:groundY-80,w:170,h:22});
        platforms.push({x:650,y:groundY-250,w:220,h:22});
        platforms.push({x:980,y:groundY-120,w:210,h:22});
        platforms.push({x:1250,y:groundY-300,w:190,h:22});

    }else if(level===2){

        platforms.push({x:150,y:groundY-100,w:180,h:22});
        platforms.push({x:400,y:groundY-240,w:190,h:22});
        platforms.push({x:700,y:groundY-130,w:180,h:22});
        platforms.push({x:950,y:groundY-280,w:200,h:22});
        platforms.push({x:1250,y:groundY-160,w:180,h:22});

    }else if(level===3){

        platforms.push({x:120,y:groundY-220,w:200,h:22});
        platforms.push({x:430,y:groundY-100,w:180,h:22});
        platforms.push({x:700,y:groundY-280,w:220,h:22});
        platforms.push({x:1000,y:groundY-150,w:190,h:22});
        platforms.push({x:1300,y:groundY-300,w:200,h:22});

    }else{

        platforms.push({x:140,y:groundY-170,w:190,h:22});
        platforms.push({x:430,y:groundY-300,w:200,h:22});
        platforms.push({x:740,y:groundY-180,w:190,h:22});
        platforms.push({x:1050,y:groundY-330,w:220,h:22});
    }

    createEnemies();

    if(level<4){
        portal={
            x:1450,
            y:groundY-90,
            w:55,
            h:90
        };
    }
}

/* =========================
   ENEMIGOS
========================= */

function createEnemies(){

    const groundY=H-145;

    const types=["octopus","crab","jelly"];

    for(let i=0;i<7;i++){

        const type=types[i%types.length];

        enemies.push({
            x:260+i*190,
            y:groundY-65-rand(0,180),
            w:50,
            h:50,
            vx:rand(-1.2,1.2),
            vy:0,
            type:type,
            life:2,
            phase:rand(0,6),
            dir:Math.random()<.5?-1:1
        });
    }
}

/* =========================
   FONDO
========================= */

function drawBackground(){

    let g;

    if(level===0){
        g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,"#38d8ff");
        g.addColorStop(1,"#00518a");
    }

    if(level===1){
        g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,"#00aabf");
        g.addColorStop(1,"#123f75");
    }

    if(level===2){
        g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,"#164e83");
        g.addColorStop(1,"#030b25");
    }

    if(level===3){
        g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,"#102b69");
        g.addColorStop(1,"#09091e");
    }

    if(level===4){
        g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,"#321452");
        g.addColorStop(1,"#090313");
    }

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    /* burbujas */

    for(let i=0;i<35;i++){

        let x=((i*157-cameraX*.12)%(W+100))-50;
        let y=(i*83+performance.now()/35*(i%3+1))%H;

        ctx.beginPath();
        ctx.arc(x,y,2+(i%4),0,Math.PI*2);
        ctx.strokeStyle="rgba(255,255,255,.3)";
        ctx.stroke();
    }

    /* fondo decorativo */

    ctx.fillStyle="rgba(0,0,30,.18)";

    for(let i=0;i<12;i++){

        let x=i*180-cameraX*.2;

        ctx.beginPath();
        ctx.arc(x,H-70,90,Math.PI,Math.PI*2);
        ctx.fill();
    }
}

/* =========================
   PLATAFORMAS
========================= */

function drawPlatforms(){

    for(const p of platforms){

        const x=p.x-cameraX;

        if(x+p.w<0||x>W) continue;

        let grad=ctx.createLinearGradient(x,p.y,x,p.y+p.h);

        if(level===0){
            grad.addColorStop(0,"#62ffe8");
            grad.addColorStop(1,"#007b91");
        }

        if(level===1){
            grad.addColorStop(0,"#ff78d1");
            grad.addColorStop(1,"#7c247b");
        }

        if(level===2){
            grad.addColorStop(0,"#6688a8");
            grad.addColorStop(1,"#1b2940");
        }

        if(level===3){
            grad.addColorStop(0,"#c6a25a");
            grad.addColorStop(1,"#58401a");
        }

        if(level===4){
            grad.addColorStop(0,"#ff713b");
            grad.addColorStop(1,"#72120b");
        }

        ctx.fillStyle=grad;
        ctx.fillRect(x,p.y,p.w,p.h);

        ctx.fillStyle="rgba(255,255,255,.3)";
        ctx.fillRect(x,p.y,p.w,4);
    }
}

/* =========================
   ECRA
========================= */

function drawPlayer(){

    const x=player.x-cameraX;
    const y=player.y;

    ctx.save();

    if(player.direction<0){
        ctx.translate(x+player.w,y);
        ctx.scale(-1,1);
    }else{
        ctx.translate(x,y);
    }

    const walking=Math.abs(player.vx)>.3;

    let bob=walking?Math.sin(player.anim)*3:0;

    /* mochila de agua */

    ctx.fillStyle="#273746";
    ctx.fillRect(2,18+bob,16,34);

    ctx.fillStyle="#00eaff";
    ctx.fillRect(5,23+bob,10,18);

    /* piernas */

    ctx.strokeStyle="#263238";
    ctx.lineWidth=8;
    ctx.lineCap="round";

    if(walking){
        ctx.beginPath();
        ctx.moveTo(20,52+bob);
        ctx.lineTo(14,65+bob+Math.sin(player.anim)*5);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(32,52+bob);
        ctx.lineTo(39,65+bob-Math.sin(player.anim)*5);
        ctx.stroke();
    }else{
        ctx.beginPath();
        ctx.moveTo(20,52+bob);
        ctx.lineTo(18,65+bob);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(32,52+bob);
        ctx.lineTo(35,65+bob);
        ctx.stroke();
    }

    /* zapatillas */

    ctx.fillStyle="#111";
    ctx.fillRect(9,62+bob,14,6);
    ctx.fillRect(32,62+bob,14,6);

    /* cuerpo */

    ctx.fillStyle=level===4?"#fff":"#111";
    ctx.fillRect(13,22+bob,29,32);

    /* camiseta ECRA */

    ctx.fillStyle=level===4?"#ff4c4c":"#00d9ff";
    ctx.font="bold 9px Arial";
    ctx.fillText("ECRA",17,41+bob);

    /* cabeza */

    ctx.fillStyle="#ffc49b";
    ctx.beginPath();
    ctx.arc(28,14+bob,14,0,Math.PI*2);
    ctx.fill();

    /* gorra */

    ctx.fillStyle="#ff3ba7";
    ctx.beginPath();
    ctx.arc(28,5+bob,14,Math.PI,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#20e0ff";
    ctx.fillRect(14,3+bob,30,6);

    ctx.fillStyle="#ffe600";
    ctx.fillRect(23,-2+bob,9,7);

    /* brazo */

    ctx.strokeStyle="#ffc49b";
    ctx.lineWidth=7;

    ctx.beginPath();
    ctx.moveTo(39,28+bob);
    ctx.lineTo(50,34+bob);
    ctx.stroke();

    /* pistola de agua */

    ctx.fillStyle="#7cf6ff";
    ctx.fillRect(45,29+bob,14,7);

    ctx.fillStyle="#fff";
    ctx.fillRect(55,30+bob,9,4);

    ctx.restore();
}

/* =========================
   ENEMIGOS
========================= */

function drawEnemy(e){

    const x=e.x-cameraX;
    const y=e.y;

    ctx.save();
    ctx.translate(x,y);

    if(e.type==="octopus"){

        ctx.fillStyle="#d832d8";
        ctx.beginPath();
        ctx.arc(25,20,22,Math.PI,0);
        ctx.fill();

        ctx.strokeStyle="#b91fc1";
        ctx.lineWidth=6;

        for(let i=0;i<5;i++){

            ctx.beginPath();
            ctx.moveTo(8+i*9,28);
            ctx.lineTo(
                3+i*11,
                48+Math.sin(performance.now()/150+e.phase+i)*7
            );
            ctx.stroke();
        }

        ctx.fillStyle="#fff";
        ctx.beginPath();
        ctx.arc(18,17,5,0,Math.PI*2);
        ctx.arc(32,17,5,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#111";
        ctx.beginPath();
        ctx.arc(18,17,2,0,Math.PI*2);
        ctx.arc(32,17,2,0,Math.PI*2);
        ctx.fill();

    }else if(e.type==="crab"){

        ctx.fillStyle="#ff6038";
        ctx.beginPath();
        ctx.arc(25,27,20,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle="#ff6038";
        ctx.lineWidth=5;

        for(let i=0;i<3;i++){

            ctx.beginPath();
            ctx.moveTo(10,30+i*6);
            ctx.lineTo(-5,25+i*10);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(40,30+i*6);
            ctx.lineTo(55,25+i*10);
            ctx.stroke();
        }

        ctx.fillStyle="#fff";
        ctx.beginPath();
        ctx.arc(18,15,5,0,Math.PI*2);
        ctx.arc(32,15,5,0,Math.PI*2);
        ctx.fill();

    }else{

        ctx.fillStyle="#74fff0";
        ctx.beginPath();
        ctx.arc(25,24,22,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle="#74fff0";
        ctx.lineWidth=5;

        for(let i=0;i<4;i++){

            ctx.beginPath();
            ctx.moveTo(12+i*8,40);
            ctx.lineTo(8+i*9,57);
            ctx.stroke();
        }

        ctx.fillStyle="#111";

        ctx.beginPath();
        ctx.arc(18,21,3,0,Math.PI*2);
        ctx.arc(32,21,3,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}

/* =========================
   AGUA
========================= */

function shootWater(){

    if(player.shootCooldown>0) return;

    player.shootCooldown=.28;

    const power=Math.floor(Math.random()*4);

    shots.push({
        x:player.x+(player.direction>0?45:-15),
        y:player.y+30,
        vx:player.direction*10,
        vy:0,
        r:8,
        power:power,
        life:1.5
    });

    for(let i=0;i<5;i++)
        addParticle(player.x+25,player.y+30);
}

function drawShot(s){

    const x=s.x-cameraX;

    ctx.save();

    if(s.power===0){

        ctx.fillStyle="#6fffff";
        ctx.beginPath();
        ctx.arc(x,s.y,8,0,Math.PI*2);
        ctx.fill();

    }else if(s.power===1){

        ctx.strokeStyle="#00eaff";
        ctx.lineWidth=7;
        ctx.beginPath();
        ctx.moveTo(x-15,s.y);
        ctx.lineTo(x+15,s.y);
        ctx.stroke();

    }else if(s.power===2){

        ctx.strokeStyle="#4cffb8";
        ctx.lineWidth=10;
        ctx.beginPath();
        ctx.arc(x,s.y,15,0,Math.PI*2);
        ctx.stroke();

    }else{

        ctx.fillStyle="#b9ffff";
        ctx.beginPath();
        ctx.arc(x,s.y,17+Math.sin(performance.now()/50)*4,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}

/* =========================
   BUBBLES
========================= */

function createBubble(x,y){

    bubbles.push({
        x:x,
        y:y,
        r:30,
        life:5
    });
}

function drawBubble(b){

    ctx.strokeStyle="rgba(160,255,255,.85)";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.arc(b.x-cameraX,b.y,b.r,0,Math.PI*2);
    ctx.stroke();

    ctx.fillStyle="rgba(255,255,255,.18)";
    ctx.beginPath();
    ctx.arc(b.x-cameraX-10,b.y-10,8,0,Math.PI*2);
    ctx.fill();
}

/* =========================
   BOSS
========================= */

function createBoss(){

    bossActive=true;

    boss={
        x:1150,
        y:180,
        w:230,
        h:220,
        hp:35,
        maxHp:35,
        vx:-1,
        phase:0,
        attackTimer:2,
        tentacles:[0,0,0,0,0,0]
    };
}

function drawBoss(){

    if(!boss) return;

    const x=boss.x-cameraX;
    const y=boss.y;

    ctx.save();

    /* tentáculos */

    ctx.strokeStyle="#7137d8";
    ctx.lineWidth=20;
    ctx.lineCap="round";

    for(let i=0;i<6;i++){

        const tx=x+35+i*30;
        const ty=y+170;

        ctx.beginPath();
        ctx.moveTo(tx,ty);

        ctx.quadraticCurveTo(
            tx-30,
            ty+70,
            tx+Math.sin(boss.phase+i)*45,
            ty+120
        );

        ctx.stroke();
    }

    /* cuerpo */

    ctx.fillStyle="#4b2497";

    ctx.beginPath();
    ctx.ellipse(
        x+115,
        y+100,
        110,
        105,
        0,0,Math.PI*2
    );

    ctx.fill();

    /* ojos */

    ctx.fillStyle="#fff";

    ctx.beginPath();
    ctx.arc(x+80,y+75,28,0,Math.PI*2);
    ctx.arc(x+150,y+75,28,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.arc(x+80,y+75,10,0,Math.PI*2);
    ctx.arc(x+150,y+75,10,0,Math.PI*2);
    ctx.fill();

    /* boca */

    ctx.strokeStyle="#111";
    ctx.lineWidth=8;

    ctx.beginPath();
    ctx.arc(x+115,y+115,45,0,Math.PI);
    ctx.stroke();

    ctx.restore();

    /* barra de vida */

    const barW=Math.min(400,W*.65);
    const bx=(W-barW)/2;
    const by=60;

    ctx.fillStyle="rgba(0,0,0,.6)";
    ctx.fillRect(bx,by,barW,22);

    ctx.fillStyle="#ff334f";
    ctx.fillRect(
        bx,
        by,
        barW*(boss.hp/boss.maxHp),
        22
    );

    ctx.strokeStyle="#fff";
    ctx.strokeRect(bx,by,barW,22);

    ctx.fillStyle="#fff";
    ctx.font="bold 15px Arial";
    ctx.textAlign="center";
    ctx.fillText(
        "REY DE LAS PROFUNDIDADES",
        W/2,
        by-7
    );
    ctx.textAlign="left";
}

/* =========================
   UPDATE JUGADOR
========================= */

function updatePlayer(dt){

    if(player.invincible>0)
        player.invincible-=dt;

    if(player.shootCooldown>0)
        player.shootCooldown-=dt;

    player.vx=0;

    if(keys.left){
        player.vx=-player.speed;
        player.direction=-1;
    }

    if(keys.right){
        player.vx=player.speed;
        player.direction=1;
    }

    if(keys.jump && player.grounded){

        player.vy=player.jump;
        player.grounded=false;

        keys.jump=false;
    }

    if(keys.water)
        shootWater();

    player.vy+=.55;

    player.x+=player.vx;
    player.y+=player.vy;

    player.grounded=false;

    for(const p of platforms){

        if(
            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            player.y+player.h<=p.y+12 &&
            player.y+player.h+player.vy>=p.y
        ){

            player.y=p.y-player.h;
            player.vy=0;
            player.grounded=true;
        }
    }

    if(player.y>H+200){
        loseLife();
    }

    player.anim+=Math.abs(player.vx)dt.5;

    cameraX=player.x-W*.35;

    if(cameraX<0)
        cameraX=0;
}

/* =========================
   UPDATE ENEMIGOS
========================= */

function updateEnemies(dt){

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        e.phase+=dt*3;

        e.x+=e.vx;

        if(e.type==="octopus"){
            e.y+=Math.sin(e.phase)*.6;
        }

        if(e.type==="jelly"){
            e.y+=Math.sin(e.phase)*1.2;
        }

        if(e.type==="crab"){

            e.x+=e.dir*.8;

            if(e.x<50||e.x>1450)
                e.dir*=-1;
        }

        const enemyBox={
            x:e.x,
            y:e.y,
            w:e.w,
            h:e.h
        };

        const playerBox={
            x:player.x,
            y:player.y,
            w:player.w,
            h:player.h
        };

        if(
            player.invincible<=0 &&
            rectHit(playerBox,enemyBox)
        ){

            loseLife();
        }
    }
}

/* =========================
   UPDATE AGUA
========================= */

function updateShots(dt){

    for(let i=shots.length-1;i>=0;i--){

        const s=shots[i];

        s.x+=s.vx;
        s.y+=s.vy;
        s.life-=dt;

        let destroyed=false;

        for(let j=enemies.length-1;j>=0;j--){

            const e=enemies[j];

            const dx=s.x-(e.x+25);
            const dy=s.y-(e.y+25);

            if(Math.sqrt(dx*dx+dy*dy)<35){

                e.life--;

                createBubble(
                    e.x+25,
                    e.y+25
                );

                for(let p=0;p<15;p++)
                    addParticle(e.x+25,e.y+25);

                score+=100;

                destroyed=true;

                if(e.life<=0){

                    score+=300;

                    enemies.splice(j,1);
                }

                break;
            }
        }

        if(bossActive && boss){

            const bx=boss.x+boss.w/2;
            const by=boss.y+boss.h/2;

            if(
                Math.abs(s.x-bx)<120 &&
                Math.abs(s.y-by)<130
            ){

                boss.hp-=1+s.power;

                for(let p=0;p<12;p++)
                    addParticle(s.x,s.y,"boss");

                destroyed=true;

                if(boss.hp<=0){

                    bossActive=false;
                    boss=null;

                    score+=5000;

                    victory();
                }
            }
        }

        if(
            s.life<=0||
            s.x<cameraX-100||
            s.x>cameraX+W+300
        ){
            destroyed=true;
        }

        if(destroyed)
            shots.splice(i,1);
    }
}

/* =========================
   BOSS UPDATE
========================= */

function updateBoss(dt){

    if(!boss) return;

    boss.phase+=dt*2;

    const target=player.x-150;

    if(boss.x<target)
        boss.x+=1.1;

    if(boss.x>target)
        boss.x-=1.1;

    boss.y=150+Math.sin(boss.phase)*70;

    boss.attackTimer-=dt;

    if(boss.attackTimer<=0){

        boss.attackTimer=1.5;

        const dx=player.x-boss.x;
        const dy=player.y-boss.y;

        const len=Math.sqrt(dx*dx+dy*dy)||1;

        shots.push({
            x:boss.x+boss.w/2,
            y:boss.y+boss.h/2,
            vx:dx/len*5,
            vy:dy/len*5,
            r:13,
            power:-1,
            life:5,
            enemy:true
        });
    }

    /* colisión tentáculo */

    if(player.invincible<=0){

        for(let i=0;i<6;i++){

            const tx=boss.x+35+i*30;
            const ty=boss.y+170+
                Math.sin(boss.phase+i)*45;

            const dx=player.x+player.w/2-tx;
            const dy=player.y+player.h/2-ty;

            if(Math.sqrt(dx*dx+dy*dy)<60){

                loseLife();
                break;
            }
        }
    }
}

/* =========================
   DISPAROS DEL BOSS
========================= */

function updateEnemyShots(dt){

    for(let i=shots.length-1;i>=0;i--){

        const s=shots[i];

        if(!s.enemy) continue;

        s.x+=s.vx;
        s.y+=s.vy;
        s.life-=dt;

        if(
            player.invincible<=0 &&
            Math.abs(s.x-(player.x+20))<30 &&
            Math.abs(s.y-(player.y+30))<35
        ){

            loseLife();
            shots.splice(i,1);
            continue;
        }

        if(s.life<=0)
            shots.splice(i,1);
    }
}

/* =========================
   VIDAS
========================= */

function loseLife(){

    if(player.invincible>0)
        return;

    lives--;

    updateHUD();

    player.invincible=2;

    for(let i=0;i<20;i++)
        addParticle(player.x+20,player.y+30);

    if(lives<=0){

        gameOver=true;

        showMessage(
            "GAME OVER",
            "Puntuación: "+score,
            "VOLVER A JUGAR"
        );

        return;
    }

    player.x=Math.max(80,player.x-120);
    player.y=250;
    player.vy=0;
}

/* =========================
   PORTAL
========================= */

function drawPortal(){

    if(!portal) return;

    const x=portal.x-cameraX;

    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.ellipse(
        x+portal.w/2,
        portal.y+45,
        25,
        45,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle="#b56cff";

    ctx.beginPath();

    ctx.ellipse(
        x+portal.w/2,
        portal.y+45,
        16,
        35,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* =========================
   CAMBIO DE NIVEL
========================= */

function checkLevel(){

    if(level<4 && enemies.length===0){

        if(!portal)
            portal={
                x:player.x+350,
                y:H-235,
                w:55,
                h:90
            };

        if(
            player.x+player.w>portal.x &&
            player.x<portal.x+portal.w &&
            player.y+player.h>portal.y
        ){

            level++;

            levelComplete=true;

            showMessage(
                "NIVEL COMPLETADO",
                levels[level],
                "CONTINUAR"
            );
        }
    }

    if(level===4 &&
       enemies.length===0 &&
       !bossActive &&
       !boss &&
       !levelComplete){

        createBoss();
    }
}

/* =========================
   VICTORIA
========================= */

function victory(){

    showMessage(
        "¡VICTORIA!",
        "ECRA derrotó al Rey de las Profundidades",
        "JUGAR DE NUEVO"
    );

    gameOver=true;
}

/* =========================
   PARTÍCULAS
========================= */

function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=.08;
        p.life-=dt;

        if(p.life<=0)
            particles.splice(i,1);
    }
}

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=Math.max(0,p.life);

        ctx.fillStyle=
            p.type==="boss"?"#ff55dd":"#aaffff";

        ctx.beginPath();

        ctx.arc(
            p.x-cameraX,
            p.y,
            3+Math.random()*3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
}

/* =========================
   HUD
========================= */

function updateHUD(){

    document.getElementById("lives").textContent=
        "❤️".repeat(Math.max(0,lives));

    document.getElementById("score").textContent=
        String(score).padStart(6,"0");

    document.getElementById("levelText").textContent=
        levels[level];
}

/* =========================
   MENSAJES
========================= */

function showMessage(title,text,button){

    const m=document.getElementById("message");

    m.classList.remove("hidden");

    m.querySelector("h1").textContent=title;
    m.querySelectorAll("p")[0].textContent=text;
    m.querySelectorAll("p")[1].textContent="";
    document.getElementById("start").textContent=button;
}

document.getElementById("start").addEventListener("click",()=>{

    document.getElementById("message").classList.add("hidden");

    if(gameOver){

        level=0;
        score=0;
        lives=7;
        gameOver=false;
        levelComplete=false;

        createLevel();
        updateHUD();

        return;
    }

    if(levelComplete){

        levelComplete=false;

        createLevel();
        updateHUD();

        return;
    }

    gameStarted=true;
    createLevel();
    updateHUD();
});

/* =========================
   DIBUJO
========================= */

function draw(){

    drawBackground();
    drawPlatforms();

    if(portal)
        drawPortal();

    for(const e of enemies)
        drawEnemy(e);

    for(const b of bubbles)
        drawBubble(b);

    for(const s of shots)
        drawShot(s);

    if(bossActive)
        drawBoss();

    drawParticles();

    if(
        player.invincible<=0 ||
        Math.floor(performance.now()/100)%2===0
    ){
        drawPlayer();
    }
}

/* =========================
   GAME LOOP
========================= */

let last=performance.now();

function loop(now){

    const dt=Math.min(
        (now-last)/1000,
        .033
    );

    last=now;

    if(gameStarted &&
       !gameOver &&
       !levelComplete){

        updatePlayer(dt);
        updateEnemies(dt);
        updateShots(dt);
        updateEnemyShots(dt);
        updateParticles(dt);
        updateBoss(dt);

        checkLevel();

        updateHUD();
    }

    draw();

    requestAnimationFrame(loop);
}

createLevel();
updateHUD();
requestAnimationFrame(loop);

</script>
